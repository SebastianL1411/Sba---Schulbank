<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>SBA – Schulbank</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #f5f7fb;
    }
    header {
      padding: 22px;
      background: #172438;
      border-bottom: 1px solid #34445b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo { font-size: 25px; font-weight: bold; }
    .dev {
      color: #ffd166;
      border: 1px solid #8b7137;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    main {
      width: min(900px, 92%);
      margin: 65px auto;
      text-align: center;
    }
    h1 { font-size: clamp(30px, 6vw, 48px); }
    .bank {
      color: #80b7ff;
      font-size: 20px;
      margin: 15px 0;
    }
    .status { color: #aebbd0; font-size: 14px; }
    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-top: 40px;
    }
    button {
      min-height: 110px;
      border: 1px solid #40516b;
      border-radius: 14px;
      background: #1b2b42;
      color: white;
      font-size: 17px;
      cursor: pointer;
      padding: 20px;
    }
    button:hover { background: #263c59; }
    button span {
      display: block;
      color: #aebbd0;
      font-size: 13px;
      margin-top: 9px;
    }
    footer {
      text-align: center;
      color: #8291a8;
      padding: 25px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">SBA | Schulbank</div>
    <div class="dev">DEV VERSION</div>
  </header>

  <main>
    <h1>Willkommen bei SBA</h1>
    <div class="bank" id="bankName">Schulbank wird geladen ...</div>
    <div class="status" id="apiStatus">Verbindung wird geprüft ...</div>

    <section class="options">
      <button onclick="showNotice('Offlinebanking')">
        Offlinebanking
        <span>Bankfunktionen ohne Onlinekonto</span>
      </button>
      <button onclick="showNotice('Login')">
        Login
        <span>Bei deinem Konto anmelden</span>
      </button>
      <button onclick="showNotice('Konto erstellen')">
        Konto erstellen
        <span>Ein neues Onlinekonto beantragen</span>
      </button>
    </section>
    <p id="notice" role="status"></p>
  </main>

  <footer>
    SBA Schulbank · DEV · Testsystem – keine echten Bankgeschäfte
  </footer>

  <script>
    const API = "https://sba-dev-api.lukas-lalli.workers.dev";

    async function loadBank() {
      const name = document.getElementById("bankName");
      const status = document.getElementById("apiStatus");

      try {
        const response = await fetch(API + "/api/tenants");
        if (!response.ok) throw new Error("API-Fehler");

        const data = await response.json();
        const bank = data.tenants.find(
          item => item.status === "active"
        );

        if (bank) {
          name.textContent = bank.name;
          status.textContent = "Datenbank verbunden · " + bank.bank_code;
        } else {
          name.textContent = "Keine aktive Schulbank gefunden";
          status.textContent = "API erreichbar";
        }
      } catch (error) {
        name.textContent = "SBA Test-Schulbank";
        status.textContent = "Datenbank momentan nicht erreichbar";
      }
    }

    function showNotice(feature) {
      document.getElementById("notice").textContent =
        feature + " ist noch in Entwicklung.";
    }

    loadBank();
  </script>
</body>
</html>
