<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SBA – Schulbank DEV</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }
    header {
      padding: 24px;
      background: #17243a;
      border-bottom: 1px solid #34445c;
    }
    header h1 { margin: 0; }
    header p { color: #a9bbd2; }
    main {
      max-width: 850px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }
    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      background: #183d61;
      color: #9bd3ff;
      font-size: 13px;
    }
    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-top: 35px;
    }
    button {
      padding: 25px 15px;
      background: #1d304b;
      color: white;
      border: 1px solid #405878;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #29466a; }
    #message {
      margin-top: 25px;
      color: #a9bbd2;
    }
    footer {
      text-align: center;
      color: #8295ad;
      padding: 25px;
    }
  </style>
</head>
<body>
  <header>
    <h1>SBA – Schulbank</h1>
    <p>Das digitale Schulbanksystem</p>
    <span class="status">DEV VERSION · TESTBETRIEB</span>
  </header>

  <main>
    <h2>Willkommen bei SBA</h2>
    <p>Wähle deinen gewünschten Bereich.</p>

    <div class="options">
      <button onclick="showMessage('Offlinebanking')">
        Offlinebanking
      </button>
      <button onclick="showMessage('Login')">
        Onlinebanking – Login
      </button>
      <button onclick="showMessage('Kontoerstellung')">
        Onlinebanking – Konto erstellen
      </button>
    </div>

    <div id="message">
      SBA DEV – Es sind noch keine echten Konten eingerichtet.
    </div>
  </main>

  <footer>
    SBA Schulbank · Entwicklungsstand
  </footer>

  <script>
    function showMessage(area) {
      document.getElementById("message").textContent =
        area + " – Dieser Bereich befindet sich noch in Entwicklung.";
    }
  </script>
</body>
</html>
